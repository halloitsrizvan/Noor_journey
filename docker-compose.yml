version: '3.8'

services:
  # NestJS Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: noor-journey-server
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED}
      - FRONTEND_ORIGINS=http://localhost:80,http://localhost:8080,http://localhost:3000
      - SESSION_SECRET=${SESSION_SECRET:-change_this_to_a_random_32_character_string_for_security}
      - APP_TIMEZONE=Asia/Kolkata
    networks:
      - noor-network

  # React Frontend Web App (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: noor-journey-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - noor-network

networks:
  noor-network:
    driver: bridge
